name: Validate share pages

on:
  pull_request:
    paths:
      - "scratch/**"
      - "scripts/validate-share-pages.py"
      - ".github/workflows/validate-share-pages.yml"
  push:
    branches: [main]
    paths:
      - "scratch/**"
      - "scripts/validate-share-pages.py"
      - ".github/workflows/validate-share-pages.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate-share-pages.py
