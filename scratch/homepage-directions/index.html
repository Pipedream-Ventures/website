  <link rel="icon" href="/favicon.svg">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#ecece7;color:#23251f;font-family:Arial,Helvetica,sans-serif}button,a{font:inherit;color:inherit;cursor:pointer}a{text-decoration:none}button{background:none;border:0}button:focus-visible,a:focus-visible{outline:2px solid #b3452e;outline-offset:5px}button:hover,a:hover{color:#b3452e}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:20px 32px;background:#f8f8f4;border-bottom:1px solid #d4d5cc}.brand{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600}.brand svg{width:27px;height:27px}.tabs{display:flex;gap:5px}.tabs button{padding:10px 16px;font-size:12px;border-radius:4px}.tabs button[aria-pressed=true]{background:#24251f;color:#fafaf5}.tools{display:flex;align-items:center;gap:18px;font-size:11px}.tools button[aria-pressed=true]{text-decoration:underline;text-underline-offset:4px}.tools a{text-decoration:underline;text-underline-offset:4px}.overview{max-width:1600px;margin:auto;padding:65px 40px 40px}.eyebrow{font:10px monospace;letter-spacing:.1em;text-transform:uppercase;color:#686c61}h1{margin:18px 0 16px;font-size:clamp(40px,5vw,76px);letter-spacing:-.065em;font-weight:500}.intro{color:#64675f;line-height:1.6;font-size:14px;max-width:590px}.studies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px;margin-top:48px}.study{display:block;width:100%;padding:0;text-align:left;border-top:1px solid #b9bdb1;color:#23251f}.study-top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 16px}.study h2{margin:0;font-size:24px;letter-spacing:-.04em;font-weight:500}.study .number{font:10px monospace;color:#75796c;margin-right:12px}.study img{display:block;width:100%;aspect-ratio:1.4;object-fit:cover;object-position:top;background:#e4e3d9;transition:transform .25s,box-shadow .25s}.study:hover img{transform:translateY(-4px);box-shadow:0 12px 20px #25251915}.study p{font-size:13px;color:#606359;line-height:1.65;margin:17px 0 0}.study .tech{display:block;margin-top:17px;font:9px monospace;text-transform:uppercase;letter-spacing:.07em;color:#75796c}.viewer{height:calc(100dvh - 78px);padding:0;display:flex;justify-content:center;align-items:stretch;background:#deded5}.viewer[hidden],.overview[hidden]{display:none}.viewer.mobile{padding:20px}.viewer iframe{width:100%;height:100%;border:0;background:#f2f0e8}.viewer.mobile iframe{max-width:390px;box-shadow:0 5px 30px #0002}.overview footer{margin-top:54px;padding-top:22px;border-top:1px solid #c3c6b9;display:flex;justify-content:space-between;gap:24px;font:10px monospace;color:#6c7065}.overview footer a{text-decoration:underline;text-underline-offset:4px}
    @media(max-width:950px){.toolbar{flex-wrap:wrap;padding:14px 20px;gap:14px}.tabs{order:3;width:100%;justify-content:center}.tabs button{flex:1;padding:10px 8px;font-size:11px}.overview{padding:35px 24px}.studies{gap:20px}.study h2{font-size:19px}.study .number{margin-right:5px}.viewer{height:calc(100dvh - 116px)}}
    @media(max-width:650px){.studies{grid-template-columns:1fr;gap:34px}.overview{padding:30px 20px}.intro{font-size:13px}.study h2{font-size:25px}.study img{aspect-ratio:1.45}.tools{gap:12px}.overview footer{flex-wrap:wrap;margin-top:35px}.viewer.mobile{padding:0}}

</head>
<body>
  <header class="toolbar">
    <a href="./" class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 0v32M0 16h32M4.7 4.7l22.6 22.6M4.7 27.3L27.3 4.7" stroke="currentColor" stroke-width="3.5"/></svg>Pipedream / Directions</a>
    <nav class="tabs" aria-label="Design direction"><button data-direction="overview" aria-pressed="true">Overview</button><button data-direction="studio" aria-pressed="false">01 Studio</button><button data-direction="three" aria-pressed="false">02 Playground</button><button data-direction="cinema" aria-pressed="false">03 After Hours</button></nav>
    <div class="tools"><button id="phone" aria-pressed="false" hidden>Phone</button><a id="open" href="studio/" target="_blank" rel="noopener" hidden>Open full page ↗</a></div>
  </header>
  <main>
    <section class="overview" id="overview">
      <p class="eyebrow">Pipedream Ventures / Design studies</p><h1>Pipedream, three ways.</h1><p class="intro">Your rainbow logo. The asterisk. Music House and Rapchat up front.<br>Three different ways to put it all together.</p>
      <div class="studies">
        <button class="study" data-direction="studio"><div class="study-top"><h2><span class="number">01</span>Studio</h2><span aria-hidden="true">↗</span></div><img src="studio.jpg" alt="Studio direction preview"><p>Warm paper, confident type, the original polaroid. Simple enough to get out of the way.</p><span class="tech">Minimal / Editorial / Fast</span></button>
        <button class="study" data-direction="three"><div class="study-top"><h2><span class="number">02</span>Playground</h2><span aria-hidden="true">↗</span></div><img src="three.jpg" alt="Playground direction preview"><p>The rainbow logo becomes something you can play with. A little world inside the browser.</p><span class="tech">Three.js / Interactive / Tactile</span></button>
        <button class="study" data-direction="cinema"><div class="study-top"><h2><span class="number">03</span>After Hours</h2><span aria-hidden="true">↗</span></div><img src="cinema.jpg" alt="After Hours direction preview"><p>Lights down. Color up. A cinematic entrance that gives the studio a whole different presence.</p><span class="tech">Cinematic / Atmospheric / Motion</span></button>
      </div>
      <footer><span>Explore a direction, then try the phone view.</span><a href="/products.html">Existing product directory ↗</a></footer>
    </section>
    <section class="viewer" id="viewer" aria-label="Selected design preview" hidden><iframe id="preview" title="Pipedream website design preview"></iframe></section>
  </main>
  <script>
    const overview=document.querySelector('#overview');
    const viewer=document.querySelector('#viewer');
    const frame=document.querySelector('#preview');
    const phone=document.querySelector('#phone');
    const openLink=document.querySelector('#open');
    const names={studio:'Studio',three:'Playground',cinema:'After Hours'};
    function show(direction){
      const isOverview=!names[direction];
      overview.hidden=!isOverview;viewer.hidden=isOverview;phone.hidden=isOverview;openLink.hidden=isOverview;
      document.querySelectorAll('.tabs button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.direction===(isOverview?'overview':direction))));
      if(isOverview){frame.removeAttribute('src');history.replaceState(null,'',location.pathname);return;}
      frame.src=direction+'/';frame.title=names[direction]+' design preview';openLink.href=direction+'/';history.replaceState(null,'','#'+direction);
    }
    document.querySelectorAll('[data-direction]').forEach(button=>button.addEventListener('click',()=>show(button.dataset.direction)));
    phone.addEventListener('click',()=>{const active=viewer.classList.toggle('mobile');phone.setAttribute('aria-pressed',String(active));phone.textContent=active?'Desktop':'Phone';});
    if(location.hash)show(location.hash.slice(1));
  </script>
</body>
</html>
