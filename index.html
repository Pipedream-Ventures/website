<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17141b">
  <title>Pipedream Ventures</title>
  <meta name="description" content="We build fun things.">
  <link rel="canonical" href="https://pipedream.ventures/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Pipedream Ventures">
  <meta property="og:description" content="We build fun things.">
  <meta property="og:image" content="https://pipedream.ventures/pv-logo-512.png">
  <meta property="og:url" content="https://pipedream.ventures/">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Pipedream Ventures">
  <meta name="twitter:description" content="We build fun things.">
  <meta name="twitter:image" content="https://pipedream.ventures/pv-logo-512.png">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #111015;
      --black-soft: #1b1820;
      --cream: #f5f0e6;
      --plastic: #b9b5aa;
      --plastic-dark: #777269;
      --plastic-light: #d8d4c9;
      --red: #e63939;
      --orange: #f5a623;
      --yellow: #f8e71c;
      --green: #7ed321;
      --blue: #4a90d9;
      --violet: #9013fe;
      --magenta: #bd10e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-width: 320px;
      min-height: 100%;
      overflow: hidden;
      background: var(--black);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 28%, rgba(100, 84, 112, 0.22), transparent 34rem),
        linear-gradient(180deg, #211b27 0%, #17141b 59%, #0e0d11 100%);
      color: var(--cream);
      font-family: "Space Mono", monospace;
    }

    body::before {
      position: fixed;
      z-index: 10;
      inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 46%, rgba(0, 0, 0, 0.42) 100%),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.22'/%3E%3C/svg%3E");
      content: "";
      opacity: 0.24;
      pointer-events: none;
    }

    .room {
      position: relative;
      display: grid;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      place-items: center;
      isolation: isolate;
      perspective: 1100px;
    }

    .wall-light {
      position: absolute;
      z-index: -2;
      top: 6%;
      left: 50%;
      width: min(76rem, 110vw);
      height: min(50rem, 80vh);
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(125, 99, 146, 0.13), transparent 66%);
      filter: blur(1px);
      transform: translateX(-50%);
    }

    .floor {
      position: absolute;
      z-index: -1;
      right: 0;
      bottom: 0;
      left: 0;
      height: 34%;
      border-top: 1px solid rgba(255, 255, 255, 0.045);
      background:
        linear-gradient(105deg, transparent 0 48%, rgba(255, 255, 255, 0.018) 48.2% 48.5%, transparent 48.7%),
        linear-gradient(76deg, transparent 0 51%, rgba(255, 255, 255, 0.015) 51.2% 51.5%, transparent 51.7%),
        linear-gradient(180deg, #131116, #09090b);
      transform-origin: bottom;
    }

    .set {
      position: relative;
      z-index: 2;
      display: grid;
      width: min(94vw, 55rem);
      justify-items: center;
      padding: clamp(1rem, 4vh, 3rem) 0 clamp(1rem, 3vh, 2rem);
      transform-style: preserve-3d;
    }

    .tv {
      position: relative;
      z-index: 2;
      width: min(84vw, 41rem);
      aspect-ratio: 1.39;
      padding: clamp(1.1rem, 3.4vw, 2rem);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: clamp(1.5rem, 4vw, 2.8rem);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.11), transparent 16%),
        linear-gradient(145deg, #403b43 0%, #28252b 54%, #17151a 100%);
      box-shadow:
        inset 0 2px 1px rgba(255, 255, 255, 0.12),
        inset 0 -8px 18px rgba(0, 0, 0, 0.34),
        0 2rem 5rem rgba(0, 0, 0, 0.52);
      transform: translateZ(0);
    }

    .tv::after {
      position: absolute;
      right: 11%;
      bottom: -5%;
      left: 11%;
      height: 9%;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      content: "";
      filter: blur(18px);
      transform: translateZ(-1px);
    }

    .tv-face {
      display: grid;
      height: 100%;
      gap: clamp(0.8rem, 2vw, 1.35rem);
      grid-template-columns: minmax(0, 1fr) clamp(3.7rem, 11vw, 6rem);
    }

    .screen-bezel {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: clamp(0.55rem, 1.8vw, 1rem) solid #0d0c10;
      border-radius: 12% / 9%;
      background: #050407;
      box-shadow:
        inset 0 0 0 2px rgba(255, 255, 255, 0.04),
        inset 0 0 2.4rem #000;
    }

    .screen {
      position: absolute;
      overflow: hidden;
      border-radius: 8% / 7%;
      inset: 0;
      background:
        radial-gradient(circle at 50% 46%, rgba(112, 145, 131, 0.12), transparent 54%),
        #070b0b;
      box-shadow:
        inset 0 0 4rem rgba(0, 0, 0, 0.82),
        0 0 2rem rgba(123, 166, 145, 0.08);
    }

    .screen::before {
      position: absolute;
      z-index: 4;
      inset: 0;
      background:
        repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.035) 0,
          rgba(255, 255, 255, 0.035) 1px,
          transparent 2px,
          transparent 4px
        );
      content: "";
      mix-blend-mode: screen;
      opacity: 0.7;
      pointer-events: none;
    }

    .screen::after {
      position: absolute;
      z-index: 5;
      inset: 0;
      background:
        linear-gradient(115deg, rgba(255, 255, 255, 0.13), transparent 22% 72%, rgba(255, 255, 255, 0.025)),
        radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.55) 100%);
      content: "";
      pointer-events: none;
    }

    .screen-power {
      position: absolute;
      z-index: 3;
      top: 50%;
      left: 50%;
      width: 0;
      height: 2px;
      background: rgba(226, 255, 237, 0.88);
      box-shadow: 0 0 1rem rgba(194, 255, 216, 0.78);
      opacity: 0;
      transform: translate(-50%, -50%);
    }

    .screen-content {
      position: absolute;
      z-index: 2;
      display: grid;
      inset: 0;
      align-content: center;
      justify-items: center;
      padding: 8%;
      opacity: 1;
      text-align: center;
    }

    .boot-logo {
      width: clamp(5.4rem, 14vw, 8.4rem);
      padding: clamp(0.38rem, 1vw, 0.6rem) clamp(0.38rem, 1vw, 0.6rem) 0;
      border-radius: 1px;
      background: #242327;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.04),
        0 0 2.5rem rgba(113, 148, 127, 0.16);
      transform: rotate(-1deg);
    }

    .boot-rainbow {
      width: 100%;
      aspect-ratio: 1;
      background: linear-gradient(
        135deg,
        var(--red) 0%,
        var(--red) 14.28%,
        var(--orange) 14.28%,
        var(--orange) 28.56%,
        var(--yellow) 28.56%,
        var(--yellow) 42.84%,
        var(--green) 42.84%,
        var(--green) 57.12%,
        var(--blue) 57.12%,
        var(--blue) 71.4%,
        var(--violet) 71.4%,
        var(--violet) 85.68%,
        var(--magenta) 85.68%,
        var(--magenta) 100%
      );
      filter: saturate(0.84) brightness(0.92);
    }

    .boot-name {
      display: grid;
      height: clamp(1.4rem, 4vw, 2.3rem);
      place-items: center;
      color: rgba(245, 240, 230, 0.9);
      font-size: clamp(0.28rem, 0.84vw, 0.5rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .build-line {
      margin-top: clamp(0.9rem, 2.6vw, 1.5rem);
      color: rgba(231, 244, 235, 0.95);
      font-size: clamp(0.62rem, 1.7vw, 0.96rem);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-shadow: 0 0 0.8rem rgba(193, 255, 218, 0.28);
      text-transform: uppercase;
    }

    .tagline {
      margin-top: clamp(0.4rem, 1.4vw, 0.7rem);
      color: rgba(194, 209, 199, 0.55);
      font-size: clamp(0.4rem, 1.12vw, 0.64rem);
      letter-spacing: 0.08em;
      text-transform: lowercase;
    }

    .tv-controls {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(0.25rem, 1vw, 0.6rem) 0;
    }

    .tv-badge {
      color: rgba(255, 255, 255, 0.4);
      font-size: clamp(0.34rem, 0.9vw, 0.52rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      writing-mode: vertical-rl;
    }

    .speaker {
      width: 70%;
      flex: 1;
      margin: 18% 0;
      background-image: radial-gradient(circle, rgba(0, 0, 0, 0.68) 0 1px, transparent 1.5px);
      background-size: 7px 7px;
      opacity: 0.62;
    }

    .control-stack {
      display: grid;
      gap: clamp(0.35rem, 1vw, 0.65rem);
      justify-items: center;
    }

    .dial {
      width: clamp(1.35rem, 4vw, 2.2rem);
      aspect-ratio: 1;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      background:
        radial-gradient(circle at 40% 34%, rgba(255, 255, 255, 0.16), transparent 18%),
        conic-gradient(from -18deg, #2f2c32, #121116, #353138, #121116, #2f2c32);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.08),
        0 2px 4px rgba(0, 0, 0, 0.4);
    }

    .tv-led {
      width: clamp(0.28rem, 0.8vw, 0.42rem);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #281719;
      box-shadow: inset 0 0 2px #000;
    }

    .tv-foot {
      position: absolute;
      z-index: -1;
      bottom: -4.5%;
      width: 17%;
      height: 8%;
      border-radius: 0 0 0.6rem 0.6rem;
      background: linear-gradient(180deg, #242126, #111015);
    }

    .tv-foot.left {
      left: 16%;
      transform: skewX(-9deg);
    }

    .tv-foot.right {
      right: 16%;
      transform: skewX(9deg);
    }

    .console-stage {
      position: relative;
      z-index: 4;
      width: min(76vw, 34rem);
      height: clamp(7rem, 18vw, 9.4rem);
      margin-top: clamp(-0.8rem, -1vw, -0.25rem);
      perspective: 900px;
      transform-style: preserve-3d;
    }

    .console-shadow {
      position: absolute;
      right: 2%;
      bottom: -7%;
      left: 2%;
      height: 30%;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.68);
      filter: blur(15px);
      transform: rotateX(68deg);
    }

    .console {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 68%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 46% 46% 14% 14% / 30% 30% 24% 24%;
      background:
        linear-gradient(160deg, rgba(255, 255, 255, 0.24), transparent 24%),
        linear-gradient(180deg, var(--plastic-light), var(--plastic) 52%, var(--plastic-dark));
      box-shadow:
        inset 0 2px 2px rgba(255, 255, 255, 0.38),
        inset 0 -9px 13px rgba(55, 51, 46, 0.35),
        0 1.5rem 2.5rem rgba(0, 0, 0, 0.46);
      transform: rotateX(12deg);
      transform-origin: bottom;
    }

    .console::before {
      position: absolute;
      top: 21%;
      right: 19%;
      left: 19%;
      height: 28%;
      border-radius: 50%;
      background: linear-gradient(180deg, #77736b, #979289 60%, #c3beb4);
      box-shadow:
        inset 0 5px 7px rgba(0, 0, 0, 0.35),
        0 1px 1px rgba(255, 255, 255, 0.4);
      content: "";
    }

    .cartridge {
      position: absolute;
      z-index: 3;
      top: 0;
      left: 50%;
      width: clamp(5.8rem, 16vw, 8rem);
      height: clamp(5.7rem, 15.7vw, 7.8rem);
      padding: clamp(0.38rem, 1vw, 0.54rem);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 0.35rem 0.35rem 0.7rem 0.7rem;
      background:
        linear-gradient(150deg, rgba(255, 255, 255, 0.3), transparent 18%),
        linear-gradient(180deg, #9b968c, #69655e);
      box-shadow:
        inset 0 2px 2px rgba(255, 255, 255, 0.25),
        0 0.8rem 1.4rem rgba(0, 0, 0, 0.38);
      transform: translateX(-50%) translateY(40%);
    }

    .cartridge::before,
    .cartridge::after {
      position: absolute;
      top: 0.75rem;
      width: 0.22rem;
      height: 1rem;
      border-radius: 2px;
      background: rgba(0, 0, 0, 0.2);
      content: "";
    }

    .cartridge::before {
      left: 0.6rem;
    }

    .cartridge::after {
      right: 0.6rem;
    }

    .cartridge-label {
      display: grid;
      height: 78%;
      overflow: hidden;
      border: 2px solid #26242a;
      border-radius: 0.2rem;
      background: #1d1b21;
      grid-template-rows: 1fr 28%;
    }

    .cartridge-rainbow {
      background: linear-gradient(
        135deg,
        var(--red) 0%,
        var(--red) 14.28%,
        var(--orange) 14.28%,
        var(--orange) 28.56%,
        var(--yellow) 28.56%,
        var(--yellow) 42.84%,
        var(--green) 42.84%,
        var(--green) 57.12%,
        var(--blue) 57.12%,
        var(--blue) 71.4%,
        var(--violet) 71.4%,
        var(--violet) 85.68%,
        var(--magenta) 85.68%,
        var(--magenta) 100%
      );
    }

    .cartridge-name {
      display: grid;
      place-items: center;
      color: var(--cream);
      font-size: clamp(0.2rem, 0.6vw, 0.34rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-align: center;
      text-transform: uppercase;
    }

    .power-button {
      position: absolute;
      z-index: 5;
      bottom: 11%;
      left: 14%;
      display: grid;
      width: clamp(1.3rem, 3.6vw, 1.9rem);
      aspect-ratio: 1;
      cursor: pointer;
      border: 0;
      border-radius: 50%;
      outline: none;
      place-items: center;
      background:
        radial-gradient(circle at 38% 32%, rgba(255, 255, 255, 0.24), transparent 22%),
        #5e5a54;
      box-shadow:
        inset 0 -3px 4px rgba(0, 0, 0, 0.32),
        0 1px 1px rgba(255, 255, 255, 0.42);
    }

    .power-button:focus-visible {
      box-shadow:
        0 0 0 3px var(--cream),
        0 0 0 6px var(--violet);
    }

    .power-icon {
      position: relative;
      width: 44%;
      aspect-ratio: 1;
      border: 1px solid #2c2927;
      border-top-color: transparent;
      border-radius: 50%;
    }

    .power-icon::before {
      position: absolute;
      top: -16%;
      left: 50%;
      width: 1px;
      height: 58%;
      background: #2c2927;
      content: "";
      transform: translateX(-50%);
    }

    .console-led {
      position: absolute;
      z-index: 5;
      right: 15%;
      bottom: 17%;
      width: clamp(0.32rem, 0.8vw, 0.44rem);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #3a1d1b;
      box-shadow: inset 0 0 3px rgba(0, 0, 0, 0.8);
    }

    .table {
      position: absolute;
      z-index: 1;
      top: 68%;
      left: 50%;
      width: min(96vw, 55rem);
      height: 14%;
      border: 1px solid rgba(255, 255, 255, 0.055);
      border-radius: 50%;
      background:
        linear-gradient(96deg, transparent 24%, rgba(255, 255, 255, 0.035) 24.5%, transparent 25% 62%, rgba(255, 255, 255, 0.02) 62.5%, transparent 63%),
        linear-gradient(180deg, #342523, #1e1718 80%);
      box-shadow:
        inset 0 4px 6px rgba(255, 255, 255, 0.035),
        0 3rem 5rem rgba(0, 0, 0, 0.62);
      transform: translateX(-50%) rotateX(65deg);
    }

    .boot .cartridge {
      animation: insert-cartridge 1.05s 180ms cubic-bezier(0.5, 0, 0.2, 1) both;
    }

    .boot .console-led {
      animation: console-led-on 60ms 1.1s step-end both;
    }

    .boot .tv-led {
      animation: tv-led-on 60ms 1.2s step-end both;
    }

    .boot .screen-power {
      animation: screen-power 620ms 1.25s ease-out both;
    }

    .boot .screen-content {
      animation: screen-content 900ms 1.72s steps(9, end) both;
    }

    .boot .screen {
      animation: crt-wake 720ms 1.2s ease-out both;
    }

    @keyframes insert-cartridge {
      from {
        transform: translateX(-50%) translateY(-56%) rotateX(-8deg);
      }

      72% {
        transform: translateX(-50%) translateY(47%);
      }

      86% {
        transform: translateX(-50%) translateY(36%);
      }

      to {
        transform: translateX(-50%) translateY(40%);
      }
    }

    @keyframes console-led-on {
      from {
        background: #3a1d1b;
        box-shadow: inset 0 0 3px rgba(0, 0, 0, 0.8);
      }

      to {
        background: #ff3d32;
        box-shadow: 0 0 0.6rem rgba(255, 61, 50, 0.88);
      }
    }

    @keyframes tv-led-on {
      from {
        background: #281719;
        box-shadow: inset 0 0 2px #000;
      }

      to {
        background: #69e89a;
        box-shadow: 0 0 0.5rem rgba(105, 232, 154, 0.72);
      }
    }

    @keyframes screen-power {
      0% {
        width: 0;
        height: 2px;
        opacity: 0;
      }

      24% {
        width: 78%;
        height: 2px;
        opacity: 1;
      }

      58% {
        width: 78%;
        height: 72%;
        opacity: 0.5;
      }

      100% {
        width: 100%;
        height: 100%;
        opacity: 0;
      }
    }

    @keyframes screen-content {
      from {
        filter: blur(4px);
        opacity: 0;
        transform: translateY(2%);
      }

      to {
        filter: blur(0);
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes crt-wake {
      0% {
        filter: brightness(0);
      }

      22% {
        filter: brightness(2.4);
      }

      30% {
        filter: brightness(0.6);
      }

      100% {
        filter: brightness(1);
      }
    }

    @media (max-width: 620px) {
      .set {
        width: 100%;
        transform: translateY(-1vh);
      }

      .tv {
        width: min(92vw, 32rem);
        padding: 0.85rem;
        border-radius: 1.4rem;
      }

      .tv-face {
        gap: 0.65rem;
        grid-template-columns: minmax(0, 1fr) 3.3rem;
      }

      .screen-bezel {
        border-width: 0.55rem;
      }

      .speaker {
        background-size: 5px 5px;
      }

      .console-stage {
        width: 80vw;
        height: 7.2rem;
        margin-top: 0;
      }

      .table {
        top: 63%;
        height: 18%;
      }
    }

    @media (max-height: 720px) and (min-width: 621px) {
      .set {
        transform: scale(0.82);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot .cartridge,
      .boot .console-led,
      .boot .tv-led,
      .boot .screen-power,
      .boot .screen-content,
      .boot .screen {
        animation: none;
      }

      .console-led {
        background: #ff3d32;
        box-shadow: 0 0 0.6rem rgba(255, 61, 50, 0.88);
      }

      .tv-led {
        background: #69e89a;
        box-shadow: 0 0 0.5rem rgba(105, 232, 154, 0.72);
      }
    }
  </style>
</head>

<body class="boot">
  <main class="room">
    <div class="wall-light" aria-hidden="true"></div>
    <div class="floor" aria-hidden="true"></div>
    <div class="table" aria-hidden="true"></div>

    <div class="set">
      <section class="tv" aria-label="Pipedream Ventures on a television">
        <div class="tv-face">
          <div class="screen-bezel">
            <div class="screen">
              <div class="screen-power" aria-hidden="true"></div>

              <div class="screen-content">
                <div class="boot-logo" aria-hidden="true">
                  <div class="boot-rainbow"></div>
                  <div class="boot-name">Pipedream Ventures</div>
                </div>

                <h1 class="build-line">We build fun things.</h1>
                <p class="tagline">something dope is coming</p>
              </div>
            </div>
          </div>

          <div class="tv-controls" aria-hidden="true">
            <span class="tv-badge">Pipedream</span>
            <div class="speaker"></div>
            <div class="control-stack">
              <div class="dial"></div>
              <div class="dial"></div>
              <div class="tv-led"></div>
            </div>
          </div>
        </div>

        <div class="tv-foot left" aria-hidden="true"></div>
        <div class="tv-foot right" aria-hidden="true"></div>
      </section>

      <section class="console-stage" aria-label="Pipedream cartridge console">
        <div class="console-shadow" aria-hidden="true"></div>

        <div class="cartridge" aria-hidden="true">
          <div class="cartridge-label">
            <div class="cartridge-rainbow"></div>
            <div class="cartridge-name">Pipedream Ventures</div>
          </div>
        </div>

        <div class="console">
          <button class="power-button" type="button" aria-label="Replay the Pipedream boot sequence">
            <span class="power-icon" aria-hidden="true"></span>
          </button>
          <span class="console-led" aria-hidden="true"></span>
        </div>
      </section>
    </div>
  </main>

  <script>
    const powerButton = document.querySelector(".power-button");

    function replayBootSequence() {
      document.body.classList.remove("boot");
      void document.body.offsetWidth;
      document.body.classList.add("boot");
    }

    powerButton.addEventListener("click", replayBootSequence);
  </script>
</body>
</html>
