<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f0e6">
  <title>Pipedream Ventures</title>
  <meta name="description" content="Something dope is coming.">
  <link rel="canonical" href="https://pipedream.ventures/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Pipedream Ventures">
  <meta property="og:description" content="Something dope is coming.">
  <meta property="og:image" content="https://pipedream.ventures/pv-logo-512.png">
  <meta property="og:url" content="https://pipedream.ventures/">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Pipedream Ventures">
  <meta name="twitter:description" content="Something dope is coming.">
  <meta name="twitter:image" content="https://pipedream.ventures/pv-logo-512.png">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #f5f0e6;
      --charcoal: #2d2d2d;
      --muted: #8f8c86;
      --red: #e63939;
      --orange: #f5a623;
      --yellow: #f8e71c;
      --green: #7ed321;
      --blue: #4a90d9;
      --violet: #9013fe;
      --magenta: #bd10e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-width: 320px;
      background: var(--cream);
    }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      place-items: center;
      overflow: hidden;
      padding: clamp(2rem, 6vw, 5rem);
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.56), transparent 42%),
        var(--cream);
      color: var(--charcoal);
      font-family: "Space Mono", monospace;
    }

    main {
      position: relative;
      z-index: 1;
      display: grid;
      justify-items: center;
      width: min(100%, 32rem);
      text-align: center;
      animation: arrive 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .polaroid {
      width: clamp(13.5rem, 56vw, 17.5rem);
      padding: clamp(0.75rem, 3vw, 1rem) clamp(0.75rem, 3vw, 1rem) 0;
      overflow: hidden;
      border-radius: 3px;
      background: var(--charcoal);
      box-shadow:
        0 1px 1px rgba(45, 45, 45, 0.08),
        0 12px 36px rgba(45, 45, 45, 0.13);
      transform: rotate(-0.7deg);
      transition:
        box-shadow 320ms ease,
        transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .polaroid:hover {
      box-shadow:
        0 2px 2px rgba(45, 45, 45, 0.08),
        0 20px 56px rgba(45, 45, 45, 0.19);
      transform: translateY(-5px) rotate(0deg);
    }

    .window {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 1px;
      background: linear-gradient(
        135deg,
        var(--red) 0%,
        var(--red) 14.28%,
        var(--orange) 14.28%,
        var(--orange) 28.56%,
        var(--yellow) 28.56%,
        var(--yellow) 42.84%,
        var(--green) 42.84%,
        var(--green) 57.12%,
        var(--blue) 57.12%,
        var(--blue) 71.4%,
        var(--violet) 71.4%,
        var(--violet) 85.68%,
        var(--magenta) 85.68%,
        var(--magenta) 100%
      );
    }

    .tab {
      display: grid;
      height: clamp(3.7rem, 13vw, 4.4rem);
      place-items: center;
    }

    h1 {
      color: var(--cream);
      font-size: clamp(0.72rem, 3vw, 1rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1;
      text-transform: uppercase;
    }

    .tagline {
      margin-top: clamp(1.6rem, 5vw, 2rem);
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.055em;
      text-transform: lowercase;
    }

    .border-snake {
      position: fixed;
      z-index: 2;
      inset: 0;
      pointer-events: none;
    }

    .border-snake::before {
      position: absolute;
      border: 5px solid transparent;
      inset: 0;
      animation: border-snake 9s linear infinite;
      background:
        linear-gradient(
          90deg,
          var(--red),
          var(--orange),
          var(--yellow),
          var(--green),
          var(--blue),
          var(--violet),
          var(--magenta),
          var(--red)
        ) border-box;
      background-size: 400% 100%;
      content: "";
      mask:
        linear-gradient(#fff 0 0) padding-box,
        linear-gradient(#fff 0 0);
      mask-composite: exclude;
      -webkit-mask:
        linear-gradient(#fff 0 0) padding-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
    }

    body::after {
      position: fixed;
      z-index: 3;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      content: "";
      opacity: 0.018;
      pointer-events: none;
    }

    @keyframes arrive {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes border-snake {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 400% 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      main,
      .border-snake::before {
        animation: none;
      }

      .polaroid {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="border-snake" aria-hidden="true"></div>

  <main>
    <div class="polaroid">
      <div class="window" aria-hidden="true"></div>
      <div class="tab">
        <h1>Pipedream Ventures</h1>
      </div>
    </div>

    <p class="tagline">something dope is coming</p>
  </main>
</body>
</html>
