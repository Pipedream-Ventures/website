<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipedream Ventures</title>
  <meta name="description" content="Pipedream Ventures is a product studio in Columbus, Ohio.">
  <link rel="canonical" href="https://pipedream.ventures/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Pipedream Ventures">
  <meta property="og:description" content="Need help or curious about something? Contact us.">
  <meta property="og:image" content="https://pipedream.ventures/pv-logo-512.png">
  <meta property="og:url" content="https://pipedream.ventures/">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Pipedream Ventures">
  <meta name="twitter:description" content="Need help or curious about something? Contact us.">
  <meta name="twitter:image" content="https://pipedream.ventures/pv-logo-512.png">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Pipedream Ventures",
      "url": "https://pipedream.ventures/",
      "logo": "https://pipedream.ventures/pv-logo-512.png",
      "email": "seth@pipedream.ventures",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Columbus",
        "addressRegion": "OH",
        "addressCountry": "US"
      }
    }
  </script>

  <style>
    :root {
      --ink: #151612;
      --ink-soft: #55584f;
      --paper: #f5f0e6;
      --paper-bright: #fffdf7;
      --line: rgba(21, 22, 18, 0.16);
      --red: #e9513f;
      --orange: #f29f3f;
      --yellow: #f3cd4f;
      --green: #7faf62;
      --blue: #4a85c6;
      --violet: #7b63b5;
      --shadow: 0 32px 90px rgba(40, 34, 24, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      overflow-x: clip;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: clip;
      background:
        radial-gradient(circle at 82% 8%, rgba(74, 133, 198, 0.14), transparent 30rem),
        radial-gradient(circle at 12% 92%, rgba(233, 81, 63, 0.10), transparent 32rem),
        var(--paper);
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-image:
        linear-gradient(rgba(21, 22, 18, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(21, 22, 18, 0.035) 1px, transparent 1px);
      background-size: 28px 28px;
      content: "";
      mask-image: linear-gradient(to bottom, black, transparent 84%);
      pointer-events: none;
    }

    body::after {
      position: fixed;
      inset: 0;
      z-index: 20;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='4' stitchTiles='stitchTiles'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E");
      content: "";
      opacity: 0.045;
      pointer-events: none;
    }

    a {
      color: inherit;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .page {
      display: flex;
      width: min(calc(100% - 40px), 1120px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      flex-direction: column;
    }

    .site-header {
      display: flex;
      min-height: 82px;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: "Space Mono", monospace;
      font-size: 0.76rem;
      font-weight: 700;
      text-decoration: none;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      overflow: hidden;
      border: 5px solid var(--ink);
      border-radius: 3px;
      box-shadow: 3px 3px 0 rgba(21, 22, 18, 0.18);
      grid-template-columns: repeat(6, 1fr);
      transform: rotate(-3deg);
    }

    .brand-mark span:nth-child(1) {
      background: var(--red);
    }

    .brand-mark span:nth-child(2) {
      background: var(--orange);
    }

    .brand-mark span:nth-child(3) {
      background: var(--yellow);
    }

    .brand-mark span:nth-child(4) {
      background: var(--green);
    }

    .brand-mark span:nth-child(5) {
      background: var(--blue);
    }

    .brand-mark span:nth-child(6) {
      background: var(--violet);
    }

    .header-link {
      color: var(--ink-soft);
      font-family: "Space Mono", monospace;
      font-size: 0.68rem;
      text-decoration: none;
      text-transform: uppercase;
    }

    .header-link:hover {
      color: var(--ink);
    }

    .main {
      display: grid;
      min-height: calc(100vh - 154px);
      min-height: calc(100dvh - 154px);
      align-items: center;
      gap: clamp(42px, 8vw, 108px);
      grid-template-columns: minmax(340px, 0.95fr) minmax(420px, 1.05fr);
      padding: 62px 0 76px;
    }

    .identity {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      margin-bottom: 18px;
      color: var(--ink-soft);
      font-family: "Space Mono", monospace;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 650px;
      font-size: clamp(3.7rem, 7.5vw, 7.2rem);
      font-weight: 600;
      letter-spacing: -0.075em;
      line-height: 0.9;
    }

    .intro {
      max-width: 440px;
      margin-top: 30px;
      color: var(--ink-soft);
      font-size: clamp(1.08rem, 2vw, 1.28rem);
      line-height: 1.7;
    }

    .intro a {
      color: var(--ink);
      font-weight: 600;
      text-decoration-thickness: 1px;
      text-underline-offset: 5px;
    }

    .art {
      position: relative;
      min-height: 550px;
      isolation: isolate;
    }

    .orbit {
      position: absolute;
      inset: 22px 0 0 20px;
      z-index: -2;
      border: 1px solid var(--line);
      border-radius: 50%;
      animation: drift 14s ease-in-out infinite alternate;
    }

    .orbit::before,
    .orbit::after {
      position: absolute;
      border: 1px solid var(--line);
      border-radius: 50%;
      content: "";
    }

    .orbit::before {
      inset: 54px -26px -38px 58px;
    }

    .orbit::after {
      inset: 110px 62px 84px -52px;
    }

    .polaroid {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(78%, 390px);
      padding: 16px 16px 0;
      border-radius: 4px;
      background: var(--ink);
      box-shadow: var(--shadow);
      transform: translate(-50%, -50%) rotate(3deg);
      transition: transform 260ms ease;
    }

    .polaroid:hover {
      transform: translate(-50%, -52%) rotate(1deg);
    }

    .window {
      position: relative;
      min-height: 355px;
      overflow: hidden;
      border-radius: 2px;
      background:
        linear-gradient(130deg, rgba(255, 255, 255, 0.18), transparent 48%),
        linear-gradient(145deg, var(--red) 0%, var(--orange) 19%, var(--yellow) 36%, var(--green) 54%, var(--blue) 74%, var(--violet) 100%);
    }

    .window::before {
      position: absolute;
      width: 330px;
      height: 330px;
      border-radius: 44% 56% 62% 38% / 48% 42% 58% 52%;
      background: rgba(17, 18, 15, 0.95);
      content: "";
      filter: blur(1px);
      animation: morph 11s ease-in-out infinite alternate;
      transform: translate(72px, 42px) rotate(16deg);
    }

    .window::after {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 22%, rgba(255, 255, 255, 0.72) 0 2px, transparent 3px),
        radial-gradient(circle at 72% 18%, rgba(255, 255, 255, 0.4) 0 1px, transparent 2px),
        radial-gradient(circle at 34% 76%, rgba(255, 255, 255, 0.48) 0 1px, transparent 2px);
      background-size: 96px 96px, 74px 74px, 128px 128px;
      content: "";
      mix-blend-mode: screen;
      opacity: 0.55;
    }

    .polaroid-tab {
      display: flex;
      min-height: 78px;
      align-items: center;
      justify-content: center;
      color: var(--paper);
      font-family: "Space Mono", monospace;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .spark {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      box-shadow: 0 0 0 8px rgba(21, 22, 18, 0.06);
    }

    .spark.one {
      top: 14%;
      left: 8%;
      background: var(--red);
    }

    .spark.two {
      right: 3%;
      bottom: 22%;
      background: var(--blue);
    }

    .spark.three {
      bottom: 8%;
      left: 18%;
      background: var(--yellow);
    }

    .contact-card {
      position: absolute;
      right: -18px;
      bottom: 20px;
      z-index: 3;
      width: min(88%, 420px);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 24px;
      background: rgba(255, 253, 247, 0.94);
      box-shadow: 0 22px 60px rgba(40, 34, 24, 0.12);
      backdrop-filter: blur(14px);
      transform: rotate(-2deg);
    }

    .contact-form {
      display: grid;
      gap: 12px;
    }

    .field-row {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr 1fr;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      color: var(--ink-soft);
      font-family: "Space Mono", monospace;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
      padding: 12px 13px;
      background: rgba(245, 240, 230, 0.76);
      color: var(--ink);
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(74, 133, 198, 0.14);
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: #9a9c94;
    }

    .field textarea {
      min-height: 92px;
      resize: vertical;
    }

    .honey-field {
      position: absolute;
      left: -10000px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .submit-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .button {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--ink);
      border-radius: 999px;
      padding: 0 22px;
      background: var(--ink);
      color: var(--paper);
      cursor: pointer;
      font-size: 0.86rem;
      font-weight: 600;
      transition: transform 150ms ease, box-shadow 150ms ease;
    }

    .button:hover {
      box-shadow: 3px 3px 0 var(--blue);
      transform: translate(-1px, -1px);
    }

    .button:disabled {
      cursor: wait;
      opacity: 0.58;
      transform: none;
    }

    .form-status {
      min-height: 20px;
      color: var(--ink-soft);
      font-size: 0.76rem;
      line-height: 1.35;
    }

    .form-status.success {
      color: #4c773c;
    }

    .form-status.error {
      color: #a64032;
    }

    .footer {
      display: flex;
      min-height: 72px;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-top: 1px solid var(--line);
      color: #777a71;
      font-family: "Space Mono", monospace;
      font-size: 0.64rem;
    }

    .footer-links {
      display: flex;
      gap: 18px;
    }

    .footer-links a {
      text-decoration: none;
    }

    .footer-links a:hover {
      color: var(--ink);
    }

    @keyframes morph {
      0% {
        border-radius: 44% 56% 62% 38% / 48% 42% 58% 52%;
        transform: translate(72px, 42px) rotate(16deg);
      }

      100% {
        border-radius: 62% 38% 46% 54% / 42% 58% 38% 62%;
        transform: translate(42px, 26px) rotate(-8deg);
      }
    }

    @keyframes drift {
      0% {
        transform: rotate(-2deg) scale(0.98);
      }

      100% {
        transform: rotate(4deg) scale(1.02);
      }
    }

    @media (max-width: 860px) {
      .main {
        grid-template-columns: 1fr;
        padding-top: 54px;
      }

      .identity {
        text-align: center;
      }

      .intro {
        margin-right: auto;
        margin-left: auto;
      }

      .art {
        width: min(100%, 590px);
        min-height: 620px;
        margin: 0 auto;
      }

      .contact-card {
        right: 2%;
      }
    }

    @media (max-width: 560px) {
      .page {
        width: min(calc(100% - 24px), 1120px);
      }

      .site-header {
        min-height: 68px;
      }

      .brand {
        font-size: 0.67rem;
      }

      .brand-mark {
        width: 32px;
        height: 32px;
        border-width: 4px;
      }

      .header-link {
        display: none;
      }

      .main {
        gap: 12px;
        padding-top: 48px;
      }

      h1 {
        font-size: clamp(3.8rem, 19vw, 5.1rem);
      }

      .intro {
        margin-top: 24px;
      }

      .art {
        min-height: 670px;
      }

      .orbit {
        inset: 34px 8px 80px;
      }

      .polaroid {
        top: 37%;
        width: min(86%, 350px);
      }

      .window {
        min-height: 310px;
      }

      .contact-card {
        right: 0;
        bottom: 18px;
        width: 100%;
        padding: 20px;
        transform: none;
      }

      .field-row {
        grid-template-columns: 1fr;
      }

      .submit-row {
        align-items: stretch;
        flex-direction: column;
      }

      .button {
        width: 100%;
      }

      .footer {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        padding: 22px 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="brand" href="/" aria-label="Pipedream Ventures home">
        <span class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </span>
        <span>Pipedream Ventures</span>
      </a>
      <a class="header-link" href="mailto:seth@pipedream.ventures">seth@pipedream.ventures</a>
    </header>

    <main class="main">
      <section class="identity">
        <p class="eyebrow">Columbus, Ohio</p>
        <h1>Pipedream<br>Ventures</h1>
        <p class="intro">Need help or curious about something? <a href="#contact">Contact us.</a></p>
      </section>

      <section class="art" aria-label="Contact Pipedream Ventures">
        <div class="orbit" aria-hidden="true"></div>
        <span class="spark one" aria-hidden="true"></span>
        <span class="spark two" aria-hidden="true"></span>
        <span class="spark three" aria-hidden="true"></span>

        <div class="polaroid" aria-hidden="true">
          <div class="window"></div>
          <div class="polaroid-tab">Pipedream Ventures</div>
        </div>

        <div class="contact-card" id="contact">
          <form class="contact-form" id="contact-form">
            <div class="field-row">
              <div class="field">
                <label for="name">Name</label>
                <input id="name" name="name" autocomplete="name" placeholder="Your name" required>
              </div>
              <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required>
              </div>
            </div>

            <div class="field">
              <label for="message">What’s up?</label>
              <textarea id="message" name="message" placeholder="A few words is plenty." required></textarea>
            </div>

            <div class="honey-field" aria-hidden="true">
              <label for="website">Website</label>
              <input id="website" name="_honey" tabindex="-1" autocomplete="off">
            </div>

            <div class="submit-row">
              <button class="button" id="submit-button" type="submit">Send</button>
              <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
            </div>
          </form>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>© <span id="year"></span> Pipedream Ventures LLC</p>
      <div class="footer-links">
        <a href="/privacy.html">Privacy</a>
        <a href="/terms.html">Terms</a>
      </div>
    </footer>
  </div>

  <script>
    const contactForm = document.getElementById("contact-form");
    const submitButton = document.getElementById("submit-button");
    const formStatus = document.getElementById("form-status");
    const year = document.getElementById("year");

    year.textContent = String(new Date().getFullYear());

    function setFormState(state, message) {
      formStatus.className = "form-status";

      if (state === "success") {
        formStatus.classList.add("success");
      }

      if (state === "error") {
        formStatus.classList.add("error");
      }

      formStatus.textContent = message;
    }

    async function submitContactForm(event) {
      event.preventDefault();

      const formData = new FormData(contactForm);
      const payload = {
        name: String(formData.get("name")),
        email: String(formData.get("email")),
        message: String(formData.get("message")),
        _honey: String(formData.get("_honey")),
        _subject: "New Pipedream Ventures inquiry",
        _template: "table"
      };

      submitButton.disabled = true;
      submitButton.textContent = "Sending…";
      setFormState("", "");

      try {
        const response = await fetch("https://formsubmit.co/ajax/seth@pipedream.ventures", {
          method: "POST",
          headers: {
            "Accept": "application/json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        const wasSuccessful = response.ok && (result.success === true || result.success === "true");

        if (!wasSuccessful) {
          throw new Error("Submission failed");
        }

        contactForm.reset();
        setFormState("success", "Sent. We’ll be in touch.");
      } catch (error) {
        setFormState("error", "Couldn’t send. Email seth@pipedream.ventures.");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Send";
      }
    }

    contactForm.addEventListener("submit", submitContactForm);
  </script>
</body>
</html>
